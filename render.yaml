  #     - key: DATABASE_URL
  #       sync: false
  #     - key: REDIS_URL
  #       sync: false
  #     - key: NVIDIA_API_KEY
  #       sync: false
  #     - key: UPLOAD_DIR
  #       value: /app/uploads
